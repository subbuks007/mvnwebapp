apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvnwebapp
  namespace: prod
  labels:
    app: mvnwebapp
    env: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mvnwebapp
      env: prod
  template:
    metadata:
      labels:
        app: mvnwebapp
        env: prod
    spec:
      containers:
        - name: mvnwebapp
          image: __DOCKER_USER__/mvnwebapp:__IMAGE_TAG__
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /mvnwebapp/
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /mvnwebapp/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mvnwebapp-service
  namespace: prod
  labels:
    app: mvnwebapp
    env: prod
spec:
  type: NodePort
  selector:
    app: mvnwebapp
    env: prod
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
